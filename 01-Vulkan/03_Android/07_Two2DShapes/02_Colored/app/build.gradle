plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mv.vulkancolored2d'
    compileSdk 35
    // compileSdk {
    //     version = release(37)
    // }

    ndkVersion "29.0.14033849"
    // ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.mv.vulkancolored2d"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        // viewBinding true
    }
}

